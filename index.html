<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Room</title>
    <style>
        :root { --primary: #2C3E50; --secondary: #3498DB; --bg: #F5F7FA; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; padding: 20px; display: flex; justify-content: center; }
        #app-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 800px; width: 100%; }
        
        .task-header { color: var(--secondary); font-size: 1.8em; font-weight: bold; margin: 0; text-transform: uppercase; }
        .lesson-header { font-size: 1.4em; color: var(--primary); font-weight: bold; margin: 0; }
        .spacer-line { height: 1em; } 
        
        #lessonContextBox { background-color: #EBF5FB; padding: 20px; border-radius: 8px; border-left: 4px solid var(--secondary); margin-bottom: 20px; }
        
        .action-btn { background: var(--secondary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1.1em; cursor: pointer; transition: background 0.3s; margin-top: 10px; font-weight: bold; }
        .action-btn:hover { background: #2980B9; }
        .action-btn:disabled { background: #BDC3C7; cursor: not-allowed; }
        
        .record-btn { background: #E74C3C; }
        .record-btn:hover { background: #C0392B; }
        .recording { animation: pulse 1.5s infinite; background: #C0392B !important; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #status { margin-top: 15px; font-weight: bold; color: #7F8C8D; }
        .feedback-box { margin-top: 25px; padding: 20px; border-radius: 8px; background: #EAEDED; display: none; border-left: 4px solid #27AE60; }
        
        .rubric-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        .rubric-table th, .rubric-table td { border: 1px solid #BDC3C7; padding: 10px; text-align: center; }
        .rubric-table th { background-color: var(--primary); color: white; }
        .score-val { font-size: 1.2em; font-weight: bold; color: var(--secondary); }

        textarea { width: 100%; padding: 12px; border: 1px solid #BDC3C7; border-radius: 6px; font-size: 1em; resize: vertical; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }
        
        .mc-question { margin-bottom: 20px; padding: 15px; border: 1px solid #E0E0E0; border-radius: 8px; background: #FAFAFA; }
        .q-text { font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
        .mc-option { display: block; margin: 8px 0; padding: 10px; background: white; border: 1px solid #CCC; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .mc-option:hover { background: #F0F8FF; }
        .mc-option input { margin-right: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="lessonContextBox">
        Loading task...
    </div>

    <div id="speakingSection" style="display:none; text-align: center;">
        <button id="recordBtn" class="action-btn record-btn" onclick="toggleRecording()">🎤 Start Speaking</button>
        <p id="transcript" style="margin-top: 15px; font-style: italic; color: #34495E;"></p>
    </div>

    <div id="writingSection" style="display:none;">
        <textarea id="writeScaffold" rows="4" placeholder="Use the sentence frame to start your answer..."></textarea>
        <textarea id="writeOpen" rows="4" placeholder="Add your own thoughts or details here..."></textarea>
        <button id="submitWriteBtn" class="action-btn" onclick="submitWriting()">📝 Submit Writing</button>
    </div>

    <div id="vocabSection" style="display:none;">
        <textarea id="vocabDef" rows="2" placeholder="Write the definition in your own words..."></textarea>
        <textarea id="vocabSent" rows="2" placeholder="Write a sentence using the word..."></textarea>
        <textarea id="vocabEx" rows="2" placeholder="Give an example..."></textarea>
        <textarea id="vocabNonEx" rows="2" placeholder="Give a non-example (what it is NOT)..."></textarea>
        <button id="submitVocabBtn" class="action-btn" onclick="submitVocab()">📚 Save Vocabulary Practice</button>
    </div>

    <div id="mcSection" style="display:none;">
        <div id="mcContainer"></div>
        <button id="submitMcBtn" class="action-btn" onclick="submitDiagnosticMC()">✅ Submit Answers</button>
    </div>

    <div id="status"></div>

    <div id="feedbackBox" class="feedback-box"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbycT7T3gZ_DWeoW3gNfP30xN0h5XjQY_2D6xH_H/exec"; 

    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('studentId') || "TestStudent123";
    const lessonId = urlParams.get('lessonId');
    const taskTypeParam = (urlParams.get('taskType') || "").toLowerCase();
    const vocabId = urlParams.get('vocabId');
    const isVocabQuiz = urlParams.get('vocabQuiz') === "true";

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let recognition;
    let finalTranscript = "";
    let submissionId = "SUB_" + Date.now();
    let currentPrompt = "";
    let mcQuestionCount = 0;
    
    let isSpeaking = false;
    let currentUtterance = null;

    function toggleSpeak(text, btnId, defaultText) {
        if (!('speechSynthesis' in window)) {
            alert("Your browser does not support text-to-speech.");
            return;
        }

        const btn = document.getElementById(btnId);

        if (isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            if(btn) btn.innerText = defaultText;
            return;
        }

        // Remove any markdown or HTML before speaking
        let cleanText = text.replace(/#/g, '').replace(/\*/g, '').replace(/_/g, '').replace(/<[^>]+>/g, '');
        currentUtterance = new SpeechSynthesisUtterance(cleanText);
        
        currentUtterance.onstart = function() {
            isSpeaking = true;
            if(btn) btn.innerText = "⏹️ Stop Reading";
        };
        
        currentUtterance.onend = function() {
            isSpeaking = false;
            if(btn) btn.innerText = defaultText;
        };
        
        currentUtterance.onerror = function() {
            isSpeaking = false;
            if(btn) btn.innerText = defaultText;
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    function parseMarkdown(text) {
        if (!text) return "";
        let html = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/__(.*?)__/g, '<strong>$1</strong>')
            .replace(/_(.*?)_/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');
        return html;
    }

    async function loadData() {
        document.getElementById('lessonContextBox').innerHTML = "Loading your activity...";
        let fetchUrl = `${WEB_APP_URL}?studentId=${studentId}&taskType=${taskTypeParam}`;
        if (lessonId) fetchUrl += `&lessonId=${lessonId}`;
        if (isVocabQuiz) fetchUrl += `&vocabQuiz=true`;

        try {
            const response = await fetch(fetchUrl);
            const data = await response.json();
            
            if (data.error) {
                document.getElementById('lessonContextBox').innerHTML = `<span style="color:red;font-weight:bold;">Error:</span> ${data.error}`;
                return;
            }

            let fullText = data.fullLesson || "";
            currentPrompt = fullText; 

            // Parse out specific sections if they exist based on task type
            if (taskTypeParam === "diagnostic" || isVocabQuiz) {
                // For Diagnostic/Quizzes, we look for 🎯, 🎤/📖, and ❓ blocks
                let titleMatch = fullText.match(/🎯\s*TITLE:\s*(.*?)(?=\n|$)/i);
                let objMatch = fullText.match(/🎯\s*OBJECTIVE[\s\S]*?(?=🎤|📖|❓|$)/i);
                let passageMatch = fullText.match(/(?:🎤|📖)\s*READING PASSAGE[\s\S]*?(?=❓|$)/i);
                let mcMatch = fullText.match(/❓\s*COMPREHENSION TASK[\s\S]*?(?=Answer Key|$)/i);
                
                let titleHtml = titleMatch ? `<div class="task-header">${titleMatch[1].trim()}</div><div class="spacer-line"></div>` : "";
                let objHtml = objMatch ? `<div>${parseMarkdown(objMatch[0].trim())}</div><div class="spacer-line"></div>` : "";
                let passageHtml = passageMatch ? `<div>${parseMarkdown(passageMatch[0].trim())}</div><div class="spacer-line"></div>` : "";
                
                document.getElementById('lessonContextBox').innerHTML = titleHtml + objHtml + passageHtml;
                
                if (mcMatch) {
                    let mcRaw = mcMatch[0].replace(/❓\s*COMPREHENSION TASK/i, '').trim();
                    const mcContainer = document.getElementById('mcContainer');
                    
                    // --- THE NEW READ ALOUD BUTTON LOGIC ---
                    let html = ""; 
                    mcRaw = mcRaw.replace(/<\/?QUESTION>/gi, ''); 
                    let chunks = mcRaw.split(/(?=\n\d+\.)|(?=^\d+\.)/); 
                    mcQuestionCount = 0;
                    for (let chunk of chunks) { 
                      chunk = chunk.trim(); 
                      if (!chunk) continue; 
                      let lines = chunk.split('\n'); 
                      let qText = "";
                      let options = []; 
                      for (let line of lines) { 
                        line = line.trim(); 
                        if (/^[A-E][\.\)]/i.test(line)) { 
                          options.push(line);
                        } else if (line) { 
                          qText += line + " "; 
                        } 
                      } 
                      if (options.length > 0) { 
                        mcQuestionCount++;
                        
                        // Strip out any HTML or quotes so the speech synthesizer doesn't crash
                        let safeQText = qText.replace(/"/g, '&quot;').replace(/'/g, "\\'").replace(/<[^>]+>/g, '').trim();

                        // Inject the Read Aloud button next to the question text using flexbox
                        html += `<div class="mc-question" id="diagBlock_${mcQuestionCount}"> 
                          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                            <div class="q-text" style="margin-bottom: 0;">${parseMarkdown(qText.trim())}</div>
                            <button type="button" class="action-btn" id="diagReadBtn_${mcQuestionCount}" style="padding: 8px 12px; font-size: 0.85em; margin-left: 10px; flex-shrink: 0;" onclick="toggleSpeak('${safeQText}', 'diagReadBtn_${mcQuestionCount}', '🔊 Read Question')">🔊 Read Question</button>
                          </div>
                          <div class="spacer-line"></div>`; 
                        
                        // Render the A/B/C/D choices normally (Without audio)
                        for (let opt of options) { 
                          html += `<label class="mc-option"> <input type="radio" name="diag_question_${mcQuestionCount}" value="${opt.replace(/"/g, '&quot;')}"> ${parseMarkdown(opt)} </label>`; 
                        } 
                        html += `</div>`; 
                      } 
                    } 
                    mcContainer.innerHTML = html; 
                    // --- END OF NEW LOGIC ---

                    document.getElementById('mcSection').style.display = "block";
                }

                // If diagnostic also has a speaking task, show it after MC
                if (taskTypeParam === "diagnostic") {
                    document.getElementById('speakingSection').style.display = "block";
                    document.getElementById('status').innerText = "Please answer the questions above AND record yourself reading the passage.";
                }

            } else {
                // STANDARD LESSON/TASK PARSING
                document.getElementById('lessonContextBox').innerHTML = parseMarkdown(fullText);
                
                if (taskTypeParam === "writing") {
                    document.getElementById('writingSection').style.display = "block";
                } else if (taskTypeParam === "vocab") {
                    document.getElementById('vocabSection').style.display = "block";
                } else {
                    document.getElementById('speakingSection').style.display = "block";
                    initSpeechRecognition();
                }
            }
        } catch (e) {
            document.getElementById('lessonContextBox').innerHTML = "Failed to load task. Please check your connection.";
        }
    }

    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            document.getElementById('status').innerText = "Speech recognition is not supported in this browser. Please use Chrome.";
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + " ";
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            document.getElementById('transcript').innerText = finalTranscript + interimTranscript;
        };

        recognition.onerror = (event) => {
            if(event.error !== 'no-speech') {
                console.error("Speech Recognition Error: ", event.error);
                document.getElementById('status').innerText = "Microphone error: " + event.error;
            }
        };
    }

    async function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        const statusText = document.getElementById('status');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];
                finalTranscript = "";
                document.getElementById('transcript').innerText = "";

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = submitSpeakingAudio;

                mediaRecorder.start();
                if(recognition) recognition.start();
                
                isRecording = true;
                btn.innerText = "⏹️ Stop Recording & Submit";
                btn.classList.add('recording');
                statusText.innerText = "Recording... Speak clearly.";
                
                document.getElementById('feedbackBox').style.display = "none";
            } catch (err) {
                statusText.innerText = "Please allow microphone access to record.";
            }
        } else {
            isRecording = false;
            btn.innerText = "Processing...";
            btn.classList.remove('recording');
            btn.disabled = true;
            statusText.innerText = "Saving your audio...";
            
            if(recognition) recognition.stop();
            mediaRecorder.stop(); 
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
    }

    async function submitSpeakingAudio() {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async function() {
            const base64Audio = reader.result.split(',')[1];
            
            const mcAnswers = collectMCAnswers();
            
            const payload = {
                type: "assessment",
                studentId: studentId,
                lessonId: lessonId || "DIAGNOSTIC",
                taskType: taskTypeParam || "Speaking",
                prompt: currentPrompt,
                text: finalTranscript.trim() || "No speech detected.",
                mcAnswers: mcAnswers,
                audioBase64: base64Audio,
                mimeType: 'audio/webm',
                submissionId: submissionId
            };

            await sendPayload(payload, document.getElementById('recordBtn'));
        };
    }

    function collectMCAnswers() {
        if (mcQuestionCount === 0) return "";
        let answers = [];
        for (let i = 1; i <= mcQuestionCount; i++) {
            let selected = document.querySelector(`input[name="diag_question_${i}"]:checked`);
            if (selected) {
                answers.push(`Q${i}: ${selected.value}`);
            } else {
                answers.push(`Q${i}: Skipped`);
            }
        }
        return answers.join(" | ");
    }

    async function submitDiagnosticMC() {
        const mcAnswers = collectMCAnswers();
        const btn = document.getElementById('submitMcBtn');
        btn.disabled = true;
        btn.innerText = "Submitting...";
        document.getElementById('status').innerText = "Sending answers...";

        const payload = {
            type: "assessment",
            studentId: studentId,
            lessonId: lessonId || "DIAGNOSTIC",
            taskType: "diagnostic",
            prompt: currentPrompt,
            text: "Multiple Choice Submitted Separately",
            mcAnswers: mcAnswers,
            submissionId: submissionId
        };

        await sendPayload(payload, btn);
    }

    async function submitWriting() {
        const scaffold = document.getElementById('writeScaffold').value.trim();
        const openResp = document.getElementById('writeOpen').value.trim();
        const btn = document.getElementById('submitWriteBtn');
        
        if(!scaffold && !openResp) {
            alert("Please write something before submitting.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Submitting...";
        document.getElementById('status').innerText = "Analyzing writing...";

        const payload = {
            type: "assessment",
            studentId: studentId,
            lessonId: lessonId,
            taskType: "writing",
            prompt: currentPrompt,
            text: scaffold,
            text2: openResp,
            submissionId: submissionId
        };

        await sendPayload(payload, btn);
    }

    async function submitVocab() {
        const pDef = document.getElementById('vocabDef').value.trim();
        const pSent = document.getElementById('vocabSent').value.trim();
        const pEx = document.getElementById('vocabEx').value.trim();
        const pNonEx = document.getElementById('vocabNonEx').value.trim();
        const btn = document.getElementById('submitVocabBtn');
        
        btn.disabled = true;
        btn.innerText = "Saving...";

        const payload = {
            type: "assessment",
            studentId: studentId,
            vocabId: vocabId,
            taskType: "vocab",
            personalDef: pDef,
            personalSent: pSent,
            example: pEx,
            nonExample: pNonEx,
            submissionId: submissionId
        };

        await sendPayload(payload, btn);
    }

    async function sendPayload(payload, btnElement) {
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            const fbBox = document.getElementById('feedbackBox');
            let htmlContent = `<strong>Feedback:</strong><br><br>${parseMarkdown(result.reply)}`;
            
            if (result.score && result.score !== "N/A" && taskTypeParam !== "vocab") {
                htmlContent = `<strong>Overall Score: ${result.score}/5</strong><br><br>` + htmlContent;
                
                if (result.vocab && result.vocab !== "?") {
                     htmlContent += `
                     <table class="rubric-table">
                        <tr><th>Vocabulary</th><th>Syntax</th><th>Organization</th><th>Variety</th></tr>
                        <tr>
                            <td class="score-val">${result.vocab}</td>
                            <td class="score-val">${result.syntax}</td>
                            <td class="score-val">${result.org}</td>
                            <td class="score-val">${result.variety}</td>
                        </tr>
                     </table>`;
                }
            }
            
            fbBox.innerHTML = htmlContent;
            fbBox.style.display = "block";
            
            document.getElementById('status').innerText = "Saved successfully!";
            if(btnElement) btnElement.style.display = "none";

        } catch (e) {
            document.getElementById('status').innerText = "Error communicating with server.";
            if(btnElement) {
                btnElement.disabled = false;
                btnElement.innerText = "Retry Submit";
            }
        }
    }

    loadData();
    
</script>
</body>
</html>
